name: Publish Discord Bot v1.2.5
on:
  push:
    branches: [codex/publish-v1.2.5]
    paths: [.github/workflows/publish-v1.2.5.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2e486ac9c479e4fc2f081be7d84962ffef649f4c
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Dreamstreaming.DiscordBot.csproj --configuration Release
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          archive=Dreamstreaming.DiscordBot_1.2.5.zip
          zip -j "$archive" bin/Release/net10.0/Dreamstreaming.DiscordBot.dll
          unzip -t "$archive"
          md5sum "$archive"
          gh release create v1.2.5 "$archive" \
            --target 2e486ac9c479e4fc2f081be7d84962ffef649f4c \
            --title "Dreamstreaming Discord Bot v1.2.5" \
            --notes "Built for Jellyfin 12.4 and .NET 10. Retains the plugin ID and existing configuration and scan state paths. Build verified in GitHub Actions."
