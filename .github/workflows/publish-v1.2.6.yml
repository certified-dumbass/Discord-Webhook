name: Publish Discord Bot v1.2.6
on:
  push:
    branches: [codex/publish-v1.2.6]
    paths: [.github/workflows/publish-v1.2.6.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 059027ab3e98c97f6b002b669f469bdc73cf40c9
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Dreamstreaming.DiscordBot.csproj --configuration Release
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          archive=Dreamstreaming.DiscordBot_1.2.6.zip
          zip -j "$archive" bin/Release/net10.0/Dreamstreaming.DiscordBot.dll
          unzip -t "$archive"
          md5sum "$archive"
          gh release create v1.2.6 "$archive" \
            --target 059027ab3e98c97f6b002b669f469bdc73cf40c9 \
            --title "Dreamstreaming Discord Bot v1.2.6" \
            --notes "Fixes HTTP 401 for dashboard actions by using the signed-in Jellyfin administrator session. Built for Jellyfin 12.4 and .NET 10."
