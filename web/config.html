<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Dreamstreaming Discord Bot</title>
</head>

<body>

<div id="configPage"
     data-role="page"
     class="page type-interior pluginConfigurationPage">

    <div data-role="content">
        <div class="content-primary">

            <form id="configForm">

                <!-- Jellyfin URL -->
                <div class="inputContainer">

                    <label class="inputLabel inputLabelUnfocused"
                           for="jellyfinUrl">
                        Jellyfin Server URL
                    </label>

                    <input id="jellyfinUrl"
                           type="text"
                           is="emby-input"
                           placeholder="http://localhost:8096" />

                    <div class="fieldDescription">
                        The URL of your Jellyfin server.
                    </div>

                </div>


                <!-- Jellyfin API Key -->
                <div class="inputContainer">

                    <label class="inputLabel inputLabelUnfocused"
                           for="jellyfinApiKey">
                        Jellyfin API Key
                    </label>

                    <input id="jellyfinApiKey"
                           type="password"
                           is="emby-input"
                           placeholder="Enter your Jellyfin API key" />

                    <div class="fieldDescription">
                        The API key used to access your Jellyfin server.
                    </div>

                </div>


                <!-- Discord Webhook -->
                <div class="inputContainer">

                    <label class="inputLabel inputLabelUnfocused"
                           for="discordWebhook">
                        Discord Webhook
                    </label>

                    <input id="discordWebhook"
                           type="password"
                           is="emby-input"
                           placeholder="https://discord.com/api/webhooks/..." />

                    <div class="fieldDescription">
                        The Discord webhook used for updates.
                    </div>

                </div>


                <!-- Scan interval -->
                <div class="inputContainer">

                    <label class="inputLabel inputLabelUnfocused"
                           for="scanInterval">
                        Scan Interval
                    </label>

                    <select id="scanInterval"
                            is="emby-select">

                        <option value="1">Every hour</option>
                        <option value="6">Every 6 hours</option>
                        <option value="12">Every 12 hours</option>
                        <option value="24">Every 24 hours</option>
                        <option value="48">Every 2 days</option>
                        <option value="72">Every 3 days</option>
                        <option value="168">Every 7 days</option>

                    </select>

                    <div class="fieldDescription">
                        How often the Jellyfin server should be scanned
                        for newly added movies and series.
                    </div>

                </div>


                <!-- Save -->
                <div style="margin-top: 1em;">

                    <button
                        is="emby-button"
                        type="submit"
                        class="raised button-submit block">

                        <span>Save</span>

                    </button>

                </div>


                <!-- Test Discord -->
                <div style="margin-top: 1em;">

                    <button
                        id="testDiscordButton"
                        is="emby-button"
                        type="button"
                        class="raised button-submit block">

                        <span>Test Discord Webhook</span>

                    </button>

                </div>

            </form>

        </div>
    </div>

</div>


<script type="text/javascript">

    const pluginId =
        '7B7E6E2A-5F2B-4A3D-9F64-9D0E3C6D8A21';


    /*
     * Load configuration
     */

    document
        .querySelector('#configPage')
        .addEventListener('pageshow', function () {

            Dashboard.showLoadingMsg();

            ApiClient
                .getPluginConfiguration(pluginId)
                .then(function (config) {

                    document.querySelector('#jellyfinUrl').value =
                        config.JellyfinUrl || '';

                    document.querySelector('#jellyfinApiKey').value =
                        config.JellyfinApiKey || '';

                    document.querySelector('#discordWebhook').value =
                        config.DiscordWebhook || '';

                    document.querySelector('#scanInterval').value =
                        config.ScanIntervalHours || 168;

                    Dashboard.hideLoadingMsg();

                });

        });


    /*
     * Save configuration
     */

    document
        .querySelector('#configForm')
        .addEventListener('submit', function (e) {

            e.preventDefault();

            Dashboard.showLoadingMsg();

            ApiClient
                .getPluginConfiguration(pluginId)
                .then(function (config) {

                    config.JellyfinUrl =
                        document.querySelector('#jellyfinUrl').value;

                    config.JellyfinApiKey =
                        document.querySelector('#jellyfinApiKey').value;

                    config.DiscordWebhook =
                        document.querySelector('#discordWebhook').value;

                    config.ScanIntervalHours =
                        parseInt(
                            document.querySelector('#scanInterval').value,
                            10
                        );


                    return ApiClient.updatePluginConfiguration(
                        pluginId,
                        config
                    );

                })
                .then(function (result) {

                    Dashboard.processPluginConfigurationUpdateResult(
                        result
                    );

                });

        });


    /*
     * Test Discord webhook
     */

    document
        .querySelector('#testDiscordButton')
        .addEventListener('click', function () {

            Dashboard.showLoadingMsg();

            ApiClient
                .ajax({
                    type: 'POST',
                    url: ApiClient.getUrl(
                        'Dreamstreaming/DiscordBot/TestDiscord'
                    ),
                    dataType: 'json'
                })
                .then(function (result) {

                    Dashboard.hideLoadingMsg();

                    Dashboard.alert(
                        result.Message ||
                        'Discord test successfully sent.'
                    );

                })
                .catch(function () {

                    Dashboard.hideLoadingMsg();

                    Dashboard.alert(
                        'Discord test failed.'
                    );

                });

        });

</script>

</body>
</html>
